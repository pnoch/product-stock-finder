name: Native foundation

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-jvm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37
        run: |
          # The runner ships cmdline-tools; setup-android's default `tools`
          # package is obsolete and fails the install.
          if ! command -v sdkmanager >/dev/null; then
            export PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:$PATH"
          fi
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Verify shared rules, SQLite and presentation
        run: ./gradlew :core:jvmTest :connectors:jvmTest :carriers:jvmTest :data:jvmTest :app:jvmTest :sync:jvmTest :data:verifyCommonMainOmniShopDatabaseMigration --console=plain
      - name: Compile desktop and build Android preview
        run: ./gradlew :desktopApp:classes :androidApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: omnishop-native-debug-apk
          path: native/androidApp/build/outputs/apk/debug/androidApp-debug.apk

  ios-framework:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
              if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                SDKMANAGER="$root/cmdline-tools/latest/bin/sdkmanager"
                break
              fi
            done
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Link the shared iOS simulator framework
        run: ./gradlew :app:linkDebugFrameworkIosSimulatorArm64 --console=plain

  ios-app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT"; do
              if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
                SDKMANAGER="$root/cmdline-tools/latest/bin/sdkmanager"
                break
              fi
            done
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: cd iosApp && xcodegen generate
      - name: Build the iOS app for the simulator
        run: |
          set -o pipefail
          xcodebuild -project iosApp/OmniShop.xcodeproj -scheme OmniShop \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build \
            | tee /tmp/omnishop-ios-build.log | tail -80
      - name: Show Xcode build errors
        if: failure()
        run: grep -nE "error:|fatal error:|The following build commands failed" /tmp/omnishop-ios-build.log | tail -40 || true
      - name: Launch the app in a simulator
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Build/Products/Debug-iphonesimulator/OmniShop.app' | head -1)
          test -d "$APP"
          find "$APP" -maxdepth 2 -type f | head -20
          UDID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for xs in d.values() for x in xs if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch --terminate-running-process "$UDID" com.omnishop.ios
          sleep 6
          python3 -m venv /tmp/omnishop-ios-venv
          /tmp/omnishop-ios-venv/bin/pip install --quiet pillow
          RENDERED=0
          for _ in $(seq 1 30); do
            xcrun simctl io "$UDID" screenshot /tmp/omnishop-ios.png >/dev/null 2>&1
            if /tmp/omnishop-ios-venv/bin/python scripts/ios-frame-check.py /tmp/omnishop-ios.png; then
              RENDERED=1
              break
            fi
            sleep 2
          done
          test "$RENDERED" = "1"
      - name: Inspect the iOS app process and crash logs
        if: always()
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for xs in d.values() for x in xs if x["name"].startswith("iPhone")))')
          echo "--- launchctl ---"
          xcrun simctl spawn "$UDID" launchctl print system 2>/dev/null | grep -i -A3 omnishop || true
          echo "--- simulator crash logs ---"
          find "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs" -iname '*OmniShop*' -print -exec cat {} \; 2>/dev/null | tail -160 || true
          echo "--- host crash logs ---"
          find "$HOME/Library/Logs/DiagnosticReports" -iname '*OmniShop*' -print -exec cat {} \; 2>/dev/null | tail -160 || true
          echo "--- app errors ---"
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "OmniShop" AND (messageType == error OR messageType == fault)' 2>/dev/null | tail -80 || true
      - name: Show iOS runtime logs
        if: failure()
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for xs in d.values() for x in xs if x["name"].startswith("iPhone")))')
          echo "--- crash reports ---"
          find "$HOME/Library/Logs/DiagnosticReports" -name 'OmniShop*' -mmin -15 -print -exec cat {} \; 2>/dev/null | tail -160 || true
          echo "--- simulator log ---"
          xcrun simctl spawn "$UDID" log show --last 4m --style compact --predicate 'process == "OmniShop"' 2>/dev/null | tail -160 || true
          echo "--- app bundle ---"
          APP=$(xcrun simctl get_app_container "$UDID" com.omnishop.ios app 2>/dev/null || true)
          [ -n "$APP" ] && find "$APP" -maxdepth 3 -type f | head -80 || true
      - name: Collect the iOS crash report
        if: always()
        run: |
          mkdir -p /tmp/omnishop-crash
          find "$HOME/Library/Logs/DiagnosticReports" -iname '*OmniShop*' -exec cp {} /tmp/omnishop-crash/ \; 2>/dev/null || true
          ls -la /tmp/omnishop-crash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnishop-ios-crash
          path: /tmp/omnishop-crash/**
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omnishop-ios-simulator
          path: /tmp/omnishop-ios.png
