name: OmniShop
options:
  bundleIdPrefix: com.omnishop
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  OmniShopTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OmniShopTests
    dependencies:
      - target: OmniShop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnishop.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OmniShop.app/OmniShop"
        BUNDLE_LOADER: "$(TEST_HOST)"
  OmniShop:
    type: application
    platform: iOS
    sources:
      - path: OmniShop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnishop.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OmniShop/Info.plist
        CODE_SIGN_ENTITLEMENTS: OmniShop/OmniShop.entitlements
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "OmniShopShared"
          - "-lsqlite3"
    preBuildScripts:
      - name: Build shared OmniShop framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :app:embedAndSignAppleFrameworkForXcode
schemes:
  OmniShop:
    build:
      targets:
        OmniShop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OmniShopTests
